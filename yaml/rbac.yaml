apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rollouts-plugin-trafficrouter-consul
rules:
  - verbs:
      - create
      - watch
      - get
      - update
      - patch
    apiGroups:
      - consul.hashicorp.com
    resources:
      - servicesplitters
      - serviceresolvers
  # setHeaderRoute steps write ServiceRouters. `delete` is required because the plugin removes
  # a ServiceRouter it created once the rollout is fully promoted and no routes are left on it.
  # It is granted only on servicerouters; the plugin never deletes a splitter or a resolver.
  - verbs:
      - create
      - watch
      - get
      - update
      - patch
      - delete
    apiGroups:
      - consul.hashicorp.com
    resources:
      - servicerouters
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rollouts-plugin-trafficrouter-consul
  labels:
    app.kubernetes.io/component: rollouts-controller
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/part-of: argo-rollouts
subjects:
  - kind: ServiceAccount
    name: argo-rollouts
    namespace: argo-rollouts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rollouts-plugin-trafficrouter-consul